# Additions for whatever recurring-job mechanism Sure already uses -- translate to
# config/recurring.yml or your existing cron pattern if this app doesn't use sidekiq-cron.

kite_sync_portfolio:
  cron: "*/20 * * * *"   # covers equity holdings/positions, Coin MF, and trade history in one pass
  class: "Kite::BulkSyncSchedulerJob"
  description: "Sync Zerodha holdings, Coin MF, and trades for all syncable Kite items"

kite_check_token_expiry:
  cron: "*/15 * * * *"
  class: "Kite::CheckTokenExpiryJob"
  description: "Proactively flag expired Kite sessions as requires_update"
