concurrency: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
queues:
  - [scheduled, 10] # For cron-like jobs (e.g. "daily market data sync")
  - [high_priority, 4]
  # Kite::SyncPortfolioJob / CheckTokenExpiryJob / BulkSyncSchedulerJob declare
  # `queue_as :integrations`. Without an entry here no worker ever polls that
  # queue, so every Zerodha sync sat in Redis and no holding was ever imported --
  # the cron jobs only ran because sidekiq-cron pins them to `scheduled`.
  - [integrations, 3]
  - [medium_priority, 2]
  - [low_priority, 1]
  - [default, 1]
