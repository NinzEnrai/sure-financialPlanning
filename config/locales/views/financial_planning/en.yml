    coaching:
      title: Coaching
      idle_cash_title: Cash beyond your buffer target
      idle_cash_body: You are holding about %{amount} more than the buffer you chose. It is not doing a job — worth deciding whether it should stay a cushion or work elsewhere.
      expensive_debt_title: Expensive debt while investing
      expensive_debt_body: You hold about %{amount} of high-interest debt and investments at the same time. Clearing that debt is a guaranteed return; investing is not.
      lifestyle_title: Spending is outrunning income
      lifestyle_body: Over the last year, spending rose about %{expense} while income rose about %{income}. Worth checking whether the gap is one-off or becoming the new normal.
      none: Nothing to flag right now
      none_hint: These observations appear when the numbers show a tension worth naming.
    capital_gains_estimate:
      title: Capital gains estimate
      period: "Taxable gains for %{label}, per person"
      empty: No realised gains to estimate yet
      empty_hint: Sell a holding and this will show each person's taxable gains after set-off and the long-term exemption.
      taxable_label: Total taxable gain (before rates)
      taxable_hint: Rates are not applied — current-year rules must be re-checked before any tax figure is quoted.
      sales_count:
        one: "%{count} sale"
        other: "%{count} sales"
      short_term: "Short-term %{amount}"
      long_term: "Long-term %{amount}"
      slab_taxed: "Slab-taxed (debt funds) %{amount}"
      exemption_used: "Long-term exemption used %{amount}"
      carried_forward: "Losses carried forward %{amount}"
      unknown:
        one: "%{count} sale has no purchase date and is excluded."
        other: "%{count} sales have no purchase date and are excluded."
      unassigned: Unassigned accounts
      footnote: An estimate for review by a chartered accountant — not a tax return. Domestic listed equity turns long-term after 365 days, foreign and unlisted shares after 730, and debt funds are slab-taxed; the Indian long-term exemption applies only to Indian households. Rates, surcharge, cess and filing deadlines are not computed.
    realised_gains:
      title: Realised gains
      period: "Sold in %{label} · FIFO cost basis"
      empty: No sales recorded this financial year
      empty_hint: When you sell a holding, its realised gain appears here with the purchase date FIFO assigns it.
      total_label: Total realised gain
      rows_note:
        one: "%{count} sale on record"
        other: "%{count} sales on record"
      short_term: Short-term gains
      short_term_hint: Domestic listed equity held 365 days or less.
      long_term: Long-term gains
      long_term_hint: Domestic listed equity over 365 days; foreign and unlisted shares over 730.
      slab_label: Slab-taxed gains (debt funds)
      slab_hint: Debt funds are taxed at your slab rate whenever sold — no long-term treatment and no exemption.
      unknown:
        one: "%{count} sale has no matching purchase date and is excluded."
        other: "%{count} sales have no matching purchase date and are excluded."
      unconverted:
        one: "%{count} sale could not be converted to your currency and is excluded."
        other: "%{count} sales could not be converted to your currency and are excluded."
      footnote: An estimate from recorded trades, fees and splits — not a tax calculation. Exemptions, set-off, surcharge and the correct asset-specific thresholds belong to the tax estimate, and rates should be re-checked each year.
    tax_harvesting:
